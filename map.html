<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>Dorm Map - Dorm Near Me!</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #9b86bd;
            --light-purple: #e2d5f3;
            --nav-purple: #9154f1;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        .top-banner {
            background-color: var(--nav-purple);
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 14px;
        }

        /* Navbar Layout */
        .navbar {
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }

        .nav-links {
            display: flex;
        }

        .nav-item {
            padding: 15px 25px;
            cursor: pointer;
            color: #555;
            font-weight: 400;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .nav-item:hover {
            color: var(--purple);
        }

        .nav-item.active {
            border-bottom: 3px solid var(--purple);
            color: var(--purple);
            font-weight: bold;
        }

        /* Auth UI */
        #auth-section {
            display: flex;
            align-items: center;
            border-left: 1px solid #eee;
            padding-left: 20px;
        }

        .btn-login-google {
            display: flex;
            align-items: center;
            background: white;
            border: 1px solid #ddd;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Kanit';
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-login-google:hover {
            background: #f5f5f5;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--purple);
        }

        .hidden {
            display: none;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            height: 600px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <div class="top-banner">
        ข้อมูลที่รวบรวมมาจาก Facebook และ google map โปรดตรวจสอบข้อมูลอีกครั้ง
    </div>

    <nav class="navbar">
        <div class="nav-links">
            <a href="index.html" class="nav-item">ค้นหาหอพัก</a>
            <a href="add-info.html" class="nav-item">เพิ่มข้อมูล</a>
            <a href="map.html" class="nav-item active">แผนที่</a>
            <a href="contact.html" class="nav-item">ติดต่อเรา</a>
        </div>

        <div id="auth-section">
            <button id="btn-login" class="btn-login-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg"
                    style="width:18px; margin-right:8px;">
                Login
            </button>
            <div id="user-info" class="hidden" style="display:flex; align-items:center; gap:10px;">
                <img id="user-photo" src="" class="user-avatar">
                <button id="btn-logout"
                    style="background:none; border:none; color:red; cursor:pointer; font-size:12px; font-family:'Kanit';">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 style="color: #2b579a; text-align: center; margin-bottom: 20px;">📍 แผนที่หอพักรอบบริเวณ</h2>

        <div class="map-wrapper">
            <iframe src="https://www.google.com/maps/d/embed?mid=1n6nSF05o3TOcwbkkbWeSiYZRZyT7D0k&ehbc=2E312F"
                width="640" height="480"></iframe>
        </div>
    </div>

    <script type="module">
        import { initAuth } from './auth.js';
        initAuth();
    </script>

</body>

</html>
