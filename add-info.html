<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>Redirecting... - Dorm Near Me!</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #7C3AED;
            --light-purple: #EEF2FF;
            --nav-purple: #6366F1;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .loading-card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            text-align: center;
            max-width: 380px;
            width: 90%;
        }

        .spinner {
            border: 4px solid var(--light-purple);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border-top-color: var(--purple);
            animation: spin 0.9s linear infinite;
            display: inline-block;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #status-text {
            color: #444;
            font-size: 16px;
            margin: 0 0 20px 0;
        }

        .btn-login-google {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 1px solid #ddd;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Kanit', sans-serif;
            font-size: 15px;
            font-weight: 500;
            color: #333;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
            white-space: nowrap;
        }

        .btn-login-google:hover {
            border-color: var(--purple);
            color: var(--purple);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.15);
            transform: translateY(-1px);
        }

        .google-icon {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="loading-card" id="status-box">
        <div class="spinner" id="spinner"></div>
        <p id="status-text">กำลังตรวจสอบสถานะการเข้าสู่ระบบ...</p>
        <button id="manual-login-btn" class="btn-login-google hidden">
            <!-- Inline Google SVG Icon -->
            <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            เข้าสู่ระบบด้วย Google
        </button>
    </div>

    <script type="module">
        import { auth, loginWithGoogle } from './auth.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const statusText = document.getElementById('status-text');
        const loginBtn = document.getElementById('manual-login-btn');
        const spinner = document.getElementById('spinner');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                statusText.innerText = "เข้าสู่ระบบแล้ว! กำลังนำคุณไปหน้าเพิ่มข้อมูล...";
                statusText.style.color = "var(--purple)";
                spinner.style.display = "inline-block";
                loginBtn.classList.add('hidden');
                window.location.href = 'add-dorm.html';
            } else {
                statusText.innerText = "โปรดเข้าสู่ระบบเพื่อเพิ่มข้อมูลหอพัก";
                spinner.style.display = "none";
                loginBtn.classList.remove('hidden');
            }
        });

        loginBtn.addEventListener('click', async () => {
            try {
                await loginWithGoogle();
            } catch (error) {
                console.error("Login failed:", error);
                alert("ไม่สามารถเข้าสู่ระบบได้: " + error.message);
            }
        });
    </script>
</body>

</html>
