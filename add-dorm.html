    <script type="module">
        import { app, initAuth } from './auth.js';
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, GeoPoint } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";

        // Initialize Firebase services
        const db = getFirestore(app);
        const storage = getStorage(app);
        const auth = getAuth(app); 
        const functions = getFunctions(app);
        const resolveMapUrlCall = httpsCallable(functions, 'resolveMapUrl');

        initAuth();

        let selectedFiles = [];
        const actualBtn = document.getElementById('actual-upload');
        const previewGallery = document.getElementById('preview-gallery');
        const phoneInput = document.getElementById('phone-input');
        const phoneError = document.getElementById('phone-error');

        // Phone input helper check
        phoneInput.addEventListener('input', () => {
            const cleaned = phoneInput.value.replace(/\D/g, '');
            phoneInput.value = cleaned;
            if (cleaned.length > 0 && cleaned.length !== 10) {
                phoneError.style.display = 'block';
            } else {
                phoneError.style.display = 'none';
            }
        });

        actualBtn.addEventListener('change', function () {
            const newFiles = Array.from(this.files);
            selectedFiles = [...selectedFiles, ...newFiles].slice(0, 10);
            renderPreviews();
        });

        function renderPreviews() {
            previewGallery.innerHTML = "";
            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const div = document.createElement('div');
                    div.className = 'preview-item';
                    div.innerHTML = `
                        <img src="${e.target.result}" alt="Preview ${index + 1}">
                        <button class="preview-remove-btn" id="remove-${index}" title="ลบรูปภาพ">✕</button>
                    `;
                    previewGallery.appendChild(div);

                    document.getElementById(`remove-${index}`).onclick = (evt) => {
                        evt.preventDefault();
                        selectedFiles.splice(index, 1);
                        renderPreviews();
                    };
                };
                reader.readAsDataURL(file);
            });
            document.getElementById('file-count').innerText = selectedFiles.length > 0 
                ? `เลือกแล้ว ${selectedFiles.length} / 10 รูป` 
                : '';
        }

        // -------------------------------------------------------------
        // GEOLOCATION & DISTANCE CALCULATOR FUNCTIONS
        // -------------------------------------------------------------

        // 1. Extract Lat/Lng from Google Maps URLs or direct Lat,Lng text
        function extractLatLngFromUrl(mapUrl) {
            if (!mapUrl) return null;
            const str = mapUrl.trim();

            // Direct Lat, Lng format (e.g. "19.028, 99.924")
            const directCoords = str.match(/^(-?\d+\.\d+)[,\s]+(-?\d+\.\d+)$/);
            if (directCoords) {
                return { lat: parseFloat(directCoords[1]), lng: parseFloat(directCoords[2]) };
            }

            // Matches @lat,lng or !3d...!4d... or q=lat,lng or query=lat,lng or ll=lat,lng
            const match = str.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) ||
                          str.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) ||
                          str.match(/(?:query|q|ll)=(-?\d+\.\d+),(-?\d+\.\d+)/);

            if (match) {
                return { lat: parseFloat(match[1]), lng: parseFloat(match[2]) };
            }
            return null;
        }

        // Deep/Recursive coordinate extractor that parses GeoPoints, objects, strings, arrays, etc.
        function extractCoordinatesFromValue(val, results = []) {
            if (val === null || val === undefined) return results;

            // 1. Objects and Arrays
            if (typeof val === 'object') {
                const lat = val.latitude ?? val.lat ?? val.Lat ?? val._lat;
                const lng = val.longitude ?? val.lng ?? val.Lng ?? val.lon ?? val._long;
                
                if (typeof lat === 'number' && typeof lng === 'number' && !isNaN(lat) && !isNaN(lng)) {
                    results.push({ lat, lng });
                    return results;
                }

                // Recursively traverse object keys / array items
                for (const key of Object.keys(val)) {
                    extractCoordinatesFromValue(val[key], results);
                }
                return results;
            }

            // 2. String format e.g. "[19.0297035° N, 99.9279776° E]" or "19.029, 99.927"
            if (typeof val === 'string') {
                const str = val.trim();
                const matches = str.match(/(-?\d+\.\d+)/g);
                if (matches && matches.length >= 2) {
                    let lat = parseFloat(matches[0]);
                    let lng = parseFloat(matches[1]);
                    if (str.includes('S')) lat = -Math.abs(lat);
                    if (str.includes('W')) lng = -Math.abs(lng);
                    
                    if (!isNaN(lat) && !isNaN(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) {
                        results.push({ lat, lng });
                    }
                }
            }

            return results;
        }

        // Categorize document ID or field key to appropriate category
        function getCategoryKey(keyStr) {
            if (!keyStr) return null;
            const cleanStr = String(keyStr).toLowerCase().replace(/[^a-z0-9ก-๙]/g, '');
            if (cleanStr.includes('711') || cleanStr.includes('seven') || cleanStr.includes('เซเว่น') || cleanStr.includes('convi')) return 'sevenEleven';
            if (cleanStr.includes('laundry') || cleanStr.includes('ซัก')) return 'laundry';
            if (cleanStr.includes('market') || cleanStr.includes('ตลาด')) return 'market';
            if (cleanStr.includes('pharm') || cleanStr.includes('ยา')) return 'pharma';
            return null;
        }

        // 2. Calculate distance between two coordinates in meters (Haversine formula)
        function getDistanceInMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000; // Earth radius in meters
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return Math.round(R * c);
        }

        // 3. Fetch POIs from 'nearbyconvi' collection and find closest distance strictly per category
        async function calculatePOIDistances(dormLat, dormLng) {
            const calculatedDistances = {
                sevenEleven: null,
                laundry: null,
                market: null,
                pharma: null
            };

            try {
                const querySnapshot = await getDocs(collection(db, "nearbyconvi"));

                querySnapshot.forEach((docSnap) => {
                    const docId = docSnap.id;
                    const docData = docSnap.data();

                    // Check if Document ID maps directly to a category
                    const docCategory = getCategoryKey(docId);

                    if (docCategory) {
                        const points = extractCoordinatesFromValue(docData);
                        let minDistance = calculatedDistances[docCategory] !== null ? calculatedDistances[docCategory] : Infinity;

                        points.forEach((point) => {
                            const dist = getDistanceInMeters(dormLat, dormLng, point.lat, point.lng);
                            if (dist < minDistance) {
                                minDistance = dist;
                            }
                        });

                        if (minDistance !== Infinity) {
                            calculatedDistances[docCategory] = minDistance;
                        }
                    } else {
                        // Check if individual fields inside document map to specific categories
                        Object.entries(docData).forEach(([fieldKey, fieldValue]) => {
                            let fieldCategory = getCategoryKey(fieldKey);
                            if (!fieldCategory && fieldValue && typeof fieldValue === 'object') {
                                if (fieldValue.type) fieldCategory = getCategoryKey(String(fieldValue.type));
                                if (!fieldCategory && fieldValue.category) fieldCategory = getCategoryKey(String(fieldValue.category));
                            }

                            if (fieldCategory) {
                                const points = extractCoordinatesFromValue(fieldValue);
                                let minDistance = calculatedDistances[fieldCategory] !== null ? calculatedDistances[fieldCategory] : Infinity;

                                points.forEach((point) => {
                                    const dist = getDistanceInMeters(dormLat, dormLng, point.lat, point.lng);
                                    if (dist < minDistance) {
                                        minDistance = dist;
                                    }
                                });

                                if (minDistance !== Infinity) {
                                    calculatedDistances[fieldCategory] = minDistance;
                                }
                            }
                        });
                    }
                });
            } catch (err) {
                console.error("Error calculating POI distances from nearbyconvi:", err);
            }

            return calculatedDistances;
        }

        // -------------------------------------------------------------
        // FORM SUBMISSION HANDLER
        // -------------------------------------------------------------
        document.getElementById('save-btn').onclick = async function () {
            const saveBtn = document.getElementById('save-btn');
            const phone = phoneInput.value.trim();
            const dormName = document.getElementById('dorm-name').value.trim();
            const mapUrl = document.getElementById('dorm-map-url').value.trim();

            // Validation Checks
            if (!auth.currentUser) { 
                alert("กรุณาเข้าสู่ระบบด้วย Google ก่อนบันทึกข้อมูล!"); 
                return; 
            }
            if (!dormName) { 
                alert("กรุณากรอกชื่อหอพัก"); 
                return; 
            }
            if (!mapUrl) {
                alert("กรุณาระบุลิงก์ Google Maps");
                return;
            }

            saveBtn.disabled = true;

            // Resolve short links via Firebase Cloud Function if needed
            let targetUrl = mapUrl;
            if (mapUrl.includes('goo.gl') || mapUrl.includes('maps.app')) {
                saveBtn.innerText = "กำลังแปลงลิงก์ Google Maps...";
                try {
                    const result = await resolveMapUrlCall({ url: mapUrl });
                    targetUrl = result.data.longUrl || mapUrl;
                } catch (err) {
                    console.error("Failed to resolve short URL:", err);
                    alert("ไม่สามารถแปลงลิงก์ Google Maps ได้ กรุณาตรวจสอบลิงก์อีกครั้ง");
                    saveBtn.disabled = false;
                    saveBtn.innerText = "บันทึกข้อมูล";
                    return;
                }
            }

            // Extract Lat/Lng
            const coords = extractLatLngFromUrl(targetUrl);
            if (!coords) {
                alert("ไม่สามารถดึงพิกัดจากลิงก์ Google Maps ได้ กรุณาใช้ลิงก์ Google Maps ที่มีพิกัดพินถูกต้อง");
                saveBtn.disabled = false;
                saveBtn.innerText = "บันทึกข้อมูล";
                return;
            }

            if (phone.length !== 10) { 
                alert("กรุณากรอกเบอร์โทรให้ครบ 10 หลัก"); 
                saveBtn.disabled = false;
                saveBtn.innerText = "บันทึกข้อมูล";
                return; 
            }
            if (selectedFiles.length === 0) { 
                alert("กรุณาอัปโหลดรูปภาพอย่างน้อย 1 รูป"); 
                saveBtn.disabled = false;
                saveBtn.innerText = "บันทึกข้อมูล";
                return; 
            }

            saveBtn.innerText = "กำลังคำนวณระยะทางและอัปโหลดรูปภาพ...";

            try {
                // 1. Calculate nearest distances strictly per category (7-11, laundry, market, pharma)
                const calculatedDistances = await calculatePOIDistances(coords.lat, coords.lng);

                // 2. Setup document ID
                const newDormDoc = doc(db, "pendingListings", dormName);
                const dormId = newDormDoc.id;

                // 3. Batch upload images to Firebase Storage
                const imageUrls = [];
                let imgCounter = 1;
                for (const file of selectedFiles) {
                    const extension = file.name.split('.').pop() || 'jpg';
                    const fileName = `image_${imgCounter}.${extension}`;
                    const storageRef = ref(storage, `dorms/${dormId}/${fileName}`);
                    
                    await uploadBytes(storageRef, file);
                    const url = await getDownloadURL(storageRef);
                    imageUrls.push(url);
                    imgCounter++;
                }

                saveBtn.innerText = "กำลังบันทึกข้อมูล...";

                const roomAmenities = Array.from(document.querySelectorAll('#room-amenities input:checked'))
                                         .map(cb => cb.value);

                // 4. Prepare complete data object
                const data = {
                    name: dormName,
                    details: document.getElementById('dorm-details').value.trim(),
                    mapUrl: mapUrl,
                    location: new GeoPoint(coords.lat, coords.lng), // Store GeoPoint
                    status: "pending",
                    price: Number(document.getElementById('dorm-price').value) || 0,
                    priceMin: Number(document.getElementById('dorm-price').value) || 0,
                    distance: Number(document.getElementById('uni-distance').value) || 0,
                    phone: phone,
                    rules: document.getElementById('dorm-rules').value.trim(),
                    images: imageUrls,
                    distances: calculatedDistances, // Computed Map: { sevenEleven, laundry, market, pharma }
                    amenities: roomAmenities,
                    zone: document.querySelector('input[name="dzone"]:checked')?.value || "ไม่ระบุ",
                    type: document.querySelector('input[name="dtype"]:checked')?.value || "ไม่ระบุ",
                    createdBy: auth.currentUser.uid,
                    timestamp: new Date()
                };

                // 5. Save record into pendingListings
                await setDoc(newDormDoc, data);

                alert("ส่งข้อมูลเรียบร้อยแล้ว! ข้อมูลจะถูกตรวจสอบโดย Admin ก่อนแสดงบนเว็บไซต์ 🎉");
                window.location.href = "index.html";
            } catch (e) {
                console.error("Submission failed: ", e);
                alert("เกิดข้อผิดพลาด: " + e.message);
                saveBtn.disabled = false;
                saveBtn.innerText = "บันทึกข้อมูล";
            }
        };
    </script>
</body>
