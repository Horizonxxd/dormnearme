<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dorm Details - Dorm Near Me!</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #7C3AED;
            --light-purple: #EEF2FF;
            --nav-purple: #6366F1;
            --red-discount: #EF4444;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        /* 1. Top Announcement Bar - Matched Design System */
        .top-banner {
            background-color: var(--nav-purple);
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 14px;
        }

        /* 2. Navigation Bar - Matched Design System */
        .navbar {
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            border-bottom: 1px solid #eee;
        }

        .nav-links {
            display: flex;
        }

        .nav-item {
            padding: 15px 25px;
            cursor: pointer;
            color: #555;
            font-weight: 400;
            text-decoration: none;
            transition: 0.2s;
            display: inline-block;
        }

        .nav-item:hover {
            color: var(--purple);
        }

        /* Auth Section Styling - Matched Design System */
        #auth-section {
            display: flex;
            align-items: center;
            border-left: 1px solid #eee;
            padding-left: 20px;
        }

        .btn-login-google {
            display: flex;
            align-items: center;
            background: white;
            border: 1px solid #ddd;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Kanit';
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-login-google:hover {
            border-color: var(--purple);
            color: var(--purple);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--purple);
        }

        .hidden {
            display: none !important;
        }

        /* Detail Layout */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Image Gallery Overhaul */
        .gallery-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            height: 400px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .main-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #eee;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .main-img:hover,
        .side-img:hover {
            opacity: 0.9;
        }

        .side-imgs {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            overflow: hidden;
        }

        .side-img-box {
            flex: 1;
            height: 50%;
            overflow: hidden;
            background: #eaeaea;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .side-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        /* Lightbox Overlay Styles */
        .lightbox-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .lightbox-content {
            max-width: 85%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .lightbox-close:hover {
            color: var(--light-purple);
        }

        .lightbox-prev,
        .lightbox-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            font-size: 50px;
            font-weight: bold;
            padding: 16px;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .lightbox-prev {
            left: 30px;
        }

        .lightbox-next {
            right: 30px;
        }

        .lightbox-prev:hover,
        .lightbox-next:hover {
            background: rgba(255, 255, 255, 0.2);
            color: var(--light-purple);
        }

        /* Content Cards */
        .content-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* Updated Pricing Section Styles */
        .price-container {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .price-old {
            color: #9CA3AF;
            font-size: 18px;
            text-decoration: line-through;
            font-weight: 400;
            margin-bottom: -4px;
        }

        .price-big {
            color: var(--purple);
            font-size: 32px;
            font-weight: bold;
            line-height: 1.1;
        }

        .price-big.has-discount {
            color: var(--red-discount);
        }

        .badge {
            display: inline-block;
            padding: 5px 15px;
            background: var(--light-purple);
            color: var(--purple);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            margin-right: 10px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--light-purple);
            padding-bottom: 5px;
            color: #333;
        }

        /* Flex Layout for Amenities + Map */
        .split-layout {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .amenity-list-vertical {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 250px;
        }

        /* Grid Layout for 2-Column Amenities List */
        .amenities-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .map-wrapper {
            flex: 1.8;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .map-iframe-box {
            height: 320px;
            border-radius: 15px;
            overflow: hidden;
            background: #f0f0f0;
            border: 1px solid #eee;
        }

        .btn-external-map {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--light-purple);
            color: var(--purple);
            padding: 10px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: 0.2s;
            text-align: center;
        }

        .btn-external-map:hover {
            background: var(--purple);
            color: white;
        }

        .amenity-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            color: #444;
        }

        .contact-box {
            background: var(--light-purple);
            padding: 20px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-call {
            background: var(--purple);
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
            display: inline-block;
        }

        .btn-call:hover {
            opacity: 0.9;
            transform: scale(1.03);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
        }

        @media (max-width: 768px) {
            .split-layout {
                flex-direction: column;
            }

            .map-wrapper {
                width: 100%;
                flex: none;
            }

            .amenities-grid {
                grid-template-columns: 1fr;
            }

            .gallery-container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .side-imgs {
                flex-direction: row;
                height: 150px;
            }

            .side-img-box {
                height: 100%;
                width: 50%;
            }
        }
    </style>
</head>

<body>

    <div class="top-banner">
        ข้อมูลที่รวบรวมมาจาก Facebook และ google map โปรดตรวจสอบข้อมูลอีกครั้ง
    </div>

    <nav class="navbar">
        <div class="nav-links">
            <a href="index.html" class="nav-item">ค้นหาหอพัก</a>
            <a href="add-info.html" class="nav-item">เพิ่มข้อมูล</a>
            <a href="map.html" class="nav-item">แผนที่</a>
            <a href="contact.html" class="nav-item">ติดต่อเรา</a>
        </div>

        <div id="auth-section">
            <button id="btn-login" class="btn-login-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                    style="width:18px; margin-right:8px;">
                Login
            </button>
            <div id="user-info" class="hidden" style="display:flex; align-items:center; gap:10px;">
                <img id="user-photo" src="" class="user-avatar">
                <button id="btn-logout"
                    style="background:none; border:none; color:red; cursor:pointer; font-size:12px; font-family:'Kanit';">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container" id="details-content">
        <h2 style="text-align: center; margin-top: 50px; color: var(--purple);">กำลังโหลดข้อมูลหอพัก...</h2>
    </div>

    <div id="lightbox" class="lightbox-modal">
        <span class="lightbox-close" id="lightbox-close">×</span>
        <div class="lightbox-prev" id="lightbox-prev">❮</div>
        <img class="lightbox-content" id="lightbox-img" src="">
        <div class="lightbox-next" id="lightbox-next">❯</div>
    </div>

    <script type="module">
        import { app, initAuth } from './auth.js';
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        initAuth();
        const db = getFirestore(app);
        const storage = getStorage(app);

        const urlParams = new URLSearchParams(window.location.search);
        const dormId = urlParams.get('id');

        let currentImageIdx = 0;
        let activeImagesList = [];

        async function fetchImageURL(path, fallbackUrl) {
            try {
                const imgRef = ref(storage, path);
                return await getDownloadURL(imgRef);
            } catch (error) {
                return fallbackUrl;
            }
        }

        // Helper function to extract or build an embeddable Google Maps iframe URL
        function getMapInfo(data) {
            const rawUrl = data.mapUrl || data.googleMapLink || data.mapLink || '';
            let embedUrl = null;
            let externalUrl = rawUrl || null;

            // Direct Lat, Lng properties in database
            if (data.location && typeof data.location.latitude !== 'undefined' && typeof data.location.longitude !== 'undefined') {
                const lat = data.location.latitude;
                const lng = data.location.longitude;
                embedUrl = `https://maps.google.com/maps?q=${lat},${lng}&hl=th&z=16&output=embed`;
                externalUrl = `https://www.google.com/maps?q=${lat},${lng}`;
            } else if (rawUrl) {
                // Handle @lat,lng format inside Google Maps links
                const atCoordsMatch = rawUrl.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
                // Handle q=lat,lng query format
                const qCoordsMatch = rawUrl.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/);
                // Handle direct lat,lng format (e.g. 13.7563,100.5018)
                const plainCoordsMatch = rawUrl.match(/^(-?\d+\.\d+),\s*(-?\d+\.\d+)$/);

                if (atCoordsMatch) {
                    embedUrl = `https://maps.google.com/maps?q=${atCoordsMatch[1]},${atCoordsMatch[2]}&hl=th&z=16&output=embed`;
                } else if (qCoordsMatch) {
                    embedUrl = `https://maps.google.com/maps?q=${qCoordsMatch[1]},${qCoordsMatch[2]}&hl=th&z=16&output=embed`;
                } else if (plainCoordsMatch) {
                    embedUrl = `https://maps.google.com/maps?q=${plainCoordsMatch[1]},${plainCoordsMatch[2]}&hl=th&z=16&output=embed`;
                } else {
                    // Search query using name + Salaya for locality precision
                    const searchQuery = data.name ? `${data.name} ศาลายา` : rawUrl;
                    embedUrl = `https://maps.google.com/maps?q=${encodeURIComponent(searchQuery)}&hl=th&z=16&output=embed`;
                }
            } else if (data.name) {
                // Search query using Dorm Name + Salaya
                const searchQuery = `${data.name} ศาลายา`;
                embedUrl = `https://maps.google.com/maps?q=${encodeURIComponent(searchQuery)}&hl=th&z=16&output=embed`;
                externalUrl = `https://www.google.com/maps/search/${encodeURIComponent(searchQuery)}`;
            }

            return { embedUrl, externalUrl };
        }

        async function loadDormData() {
            if (!dormId) {
                document.getElementById('details-content').innerHTML = "<h2 style='text-align:center;'>ไม่พบรหัสหอพัก</h2>";
                return;
            }

            const docRef = doc(db, "listings", dormId);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();

                // Fetch image download URLs safely via Firebase Storage SDK
                const images = await Promise.all([
                    fetchImageURL(`dorms/${dormId}/image1.jpg`, 'https://via.placeholder.com/600x400'),
                    fetchImageURL(`dorms/${dormId}/image2.jpg`, 'https://via.placeholder.com/300x200'),
                    fetchImageURL(`dorms/${dormId}/image3.jpg`, 'https://via.placeholder.com/300x200')
                ]);

                activeImagesList = images;

                // Process map URL / coordinates dynamically
                const { embedUrl, externalUrl } = getMapInfo(data);

                // Pricing HTML builder (Checks 'price' field first for new dorms, fallback to 'priceMin' for existing ones)
                const currentPrice = data.price ?? data.priceMin ?? 0;
                const oldPrice = data.priceOld || data.oldPrice || null;
                const hasDiscount = oldPrice && Number(oldPrice) > Number(currentPrice);

                let priceHtml = '';
                if (hasDiscount) {
                    priceHtml = `
                        <div class="price-container">
                            <div class="price-old">฿${Number(oldPrice).toLocaleString()}</div>
                            <div class="price-big has-discount">฿${Number(currentPrice).toLocaleString()}</div>
                            <small style="color:#888;">ราคาพิเศษต่อเดือน</small>
                        </div>
                    `;
                } else {
                    priceHtml = `
                        <div class="price-container">
                            <div class="price-big">฿${Number(currentPrice).toLocaleString()}</div>
                            <small style="color:#888;">ราคาเริ่มต้นต่อเดือน</small>
                        </div>
                    `;
                }

                document.title = `${data.name || 'รายละเอียดหอพัก'} - Dorm Near Me!`;

                document.getElementById('details-content').innerHTML = `
                    <div class="gallery-container">
                        <img src="${images[0]}" onerror="this.src='https://via.placeholder.com/600x400'" class="main-img" data-idx="0">
                        <div class="side-imgs">
                            <div class="side-img-box">
                                <img src="${images[1]}" onerror="this.src='https://via.placeholder.com/300x200'" class="side-img" data-idx="1">
                            </div>
                            <div class="side-img-box">
                                <img src="${images[2]}" onerror="this.src='https://via.placeholder.com/300x200'" class="side-img" data-idx="2">
                            </div>
                        </div>
                    </div>

                    <div class="content-card">
                        <div class="header-section">
                            <div>
                                <h1 style="margin:0; color:#333;">${data.name || 'หอพักไม่ระบุชื่อ'}</h1>
                                <p style="color:#666; margin: 5px 0 15px 0;">📍 ${data.zone || '-'} | ห่างจากมหาวิทยาลัย ${data.distance || '-'} เมตร</p>
                                <div>
                                    <span class="badge">${data.type || 'หอพักรวม'}</span>
                                </div>
                            </div>
                            ${priceHtml}
                        </div>
                    </div>

                    <div class="content-card">
                        <div class="section-title">รายละเอียดและที่ตั้ง</div>
                        <div class="split-layout">
                            <div class="amenity-list-vertical">
                                <strong style="color:var(--purple); margin-bottom: 5px; display: block;">สิ่งอำนวยความสะดวก:</strong>
                                
                                <div class="amenities-grid">
                                    ${(data.amenities && data.amenities.length > 0) ? data.amenities.map(a => `
                                        <div class="amenity-item">◦ ${a}</div>
                                    `).join('') : '<div class="amenity-item">◦ ไม่ได้ระบุ</div>'}
                                </div>

                                <strong style="color:var(--purple); margin-top: 5px; margin-bottom: 5px; display: block;">สถานที่ใกล้เคียง:</strong>
                                <div class="amenity-item">• ห่างจาก 7-11: ${data.distances && data.distances.sevenEleven ? data.distances.sevenEleven + ' เมตร' : '-'}</div>
                                <div class="amenity-item">• ห่างจาก ร้านซักอบผ้า: ${data.distances && data.distances.laundry ? data.distances.laundry + ' เมตร' : '-'}</div>
                                <div class="amenity-item">• ห่างจาก ร้านขายยา: ${data.distances && data.distances.pharma ? data.distances.pharma + ' เมตร' : '-'}</div>
                                <div class="amenity-item">• ห่างจาก ตลาด: ${data.distances && data.distances.market ? data.distances.market + ' เมตร' : '-'}</div>
                            </div>

                            <div class="map-wrapper">
                                <div class="map-iframe-box">
                                    ${embedUrl ? `
                                        <iframe 
                                            width="100%" 
                                            height="100%" 
                                            frameborder="0" 
                                            style="border:0;" 
                                            src="${embedUrl}" 
                                            allowfullscreen>
                                        </iframe>
                                    ` : '<div style="display:flex; align-items:center; justify-content:center; height:100%; color:#888;">ไม่มีข้อมูลลิงก์หรือพิกัดแผนที่</div>'}
                                </div>
                                ${externalUrl ? `
                                    <a href="${externalUrl}" target="_blank" class="btn-external-map">
                                        📍 เปิดใน Google Maps
                                    </a>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    <div class="content-card">
                        <div class="section-title">สนใจติดต่อสอบถาม</div>
                        <div class="contact-box">
                            <div style="flex:1;">
                                <strong style="color: #333;">เบอร์โทรศัพท์:</strong> <span style="color: var(--purple); font-weight: 600;">${data.contact || data.phone || 'โปรดติดต่อผ่าน Facebook'}</span> <br>
                                <small style="color:#666;">แจ้งว่าติดต่อมาจากเว็บไซต์ "Dorm Near Me!"</small>
                            </div>
                            <a href="tel:${data.contact || data.phone || ''}" class="btn-call">📞 โทรเลย</a>
                        </div>
                    </div>

                    <div style="text-align: center; margin-bottom: 40px;">
                        <a href="index.html" style="color: var(--purple); font-weight: 500; text-decoration:none;">← กลับไปหน้าหลัก</a>
                    </div>
                `;

                setupLightboxEvents();
            } else {
                document.getElementById('details-content').innerHTML = "<h2 style='text-align:center;'>ไม่พบข้อมูลหอพักนี้</h2>";
            }
        }

        function setupLightboxEvents() {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');

            document.querySelector('.gallery-container').addEventListener('click', (e) => {
                if (e.target.tagName === 'IMG') {
                    currentImageIdx = parseInt(e.target.getAttribute('data-idx'), 10);
                    openLightbox(activeImagesList[currentImageIdx]);
                }
            });

            function openLightbox(src) {
                lightboxImg.src = src;
                lightbox.style.display = 'flex';
            }

            function closeLightbox() {
                lightbox.style.display = 'none';
            }

            function navigateLightbox(direction) {
                currentImageIdx = (currentImageIdx + direction + activeImagesList.length) % activeImagesList.length;
                lightboxImg.src = activeImagesList[currentImageIdx];
            }

            document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
            document.getElementById('lightbox-prev').addEventListener('click', () => navigateLightbox(-1));
            document.getElementById('lightbox-next').addEventListener('click', () => navigateLightbox(1));

            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });

            window.addEventListener('keydown', (e) => {
                if (lightbox.style.display === 'flex') {
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowLeft') navigateLightbox(-1);
                    if (e.key === 'ArrowRight') navigateLightbox(1);
                }
            });
        }

        loadDormData();
    </script>
</body>

</html>
